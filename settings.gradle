pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'StrikeMod'

// Платформенно-независимая логика (чистая Java, без Minecraft API)
include 'common'

// Сборки под конкретные версии Minecraft
include 'fabric-1.20.1'
include 'fabric-1.21.1'
include 'fabric-1.21.11'
include 'fabric-26.3'
