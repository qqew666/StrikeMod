plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "strike-fabric-26.3"
}

loom {
	mods {
		"strike" {
			sourceSet sourceSets.main
		}
	}
}

// Общий код (чистая Java) подключается к каждой версии
sourceSets {
	main {
		java {
			srcDir rootProject.file('common/src/main/java')
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mc_26_3}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fapi_26_3}"
}

processResources {
	def props = project.properties
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
