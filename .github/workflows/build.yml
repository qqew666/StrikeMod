name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ fabric-1.20.1, fabric-1.21.1, fabric-1.21.11, fabric-26.3 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: strike-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error

  smoke:
    name: Smoke test (1.20.1)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dedicated server
        run: |
          chmod +x ./gradlew
          mkdir -p fabric-1.20.1/run
          printf 'eula=true\n' > fabric-1.20.1/run/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-protection=0\n' > fabric-1.20.1/run/server.properties
          timeout 300 ./gradlew :fabric-1.20.1:runServer --console=plain < /dev/null > server.log 2>&1 || true
          tail -40 server.log

      - name: Check mod loaded
        run: |
          grep -q "Strike mod initialized" server.log || { echo "::error::Мод не инициализирован"; exit 1; }
          grep -q "Done (" server.log || { echo "::error::Сервер не запустился"; exit 1; }
          echo "OK: мод загрузился, сервер стартовал"

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/strike-fabric-*.jar
          generate_release_notes: true
