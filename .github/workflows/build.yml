name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ fabric-1.20.1, fabric-1.21.1, fabric-1.21.11, fabric-26.3 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: Dump Minecraft API
        if: always()
        run: |
          {
          for MC in 1.20.1 1.21.1 1.21.11 26.3; do
            DIR=$(ls -d ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged*/${MC}* 2>/dev/null | grep -v intermediary | head -1)
            JAR=$(ls "$DIR"/*.jar 2>/dev/null | grep -v sources | head -1)
            echo ""
            echo "##################### MINECRAFT $MC #####################"
            echo "JAR=$JAR"
            if [ -z "$JAR" ]; then echo "NOT FOUND"; continue; fi
            echo "===== CLASS NAMES OF INTEREST ====="
            unzip -l "$JAR" 2>/dev/null | grep -E "NbtComponent|CustomData|ListComponent|ComponentList|ItemLore|WrittenBook|LoreComponent|Filterable|InteractionResult|PermissionSet" | awk '{print $4}' | head -30
            PAT='getServer|level\(\)|getLevel|isSingleplayer|overworld|hasPermission|permissions|setCustomName|getCustomName|getSharedSpawnPos|getSpawnPos|getHeight|getHeightmapPos|destroyBlock|removeBlock|sendParticles|playSound|displayClientMessage|sendSystemMessage|getOrCreateTag|getTag|setTag|copyTag|updateTag|getKey|getName|name\(\)|getContainerSize|experienceLevel|giveExperienceLevels|LORE|CUSTOM_DATA|CUSTOM_NAME|WRITTEN|BOOK|getMainHandItem|getInventory'
            echo "===== API (targeted) ====="
            for c in net.minecraft.world.entity.Entity \
                     net.minecraft.server.level.ServerPlayer \
                     net.minecraft.server.MinecraftServer \
                     net.minecraft.commands.CommandSourceStack \
                     net.minecraft.server.permissions.PermissionSet \
                     net.minecraft.world.level.Level \
                     net.minecraft.server.level.ServerLevel \
                     net.minecraft.world.level.block.entity.BlockEntity \
                     net.minecraft.world.level.block.entity.ChestBlockEntity \
                     net.minecraft.core.component.DataComponents \
                     net.minecraft.nbt.CompoundTag \
                     net.minecraft.core.nbt.CompoundTag \
                     net.minecraft.world.item.component.CustomData \
                     net.minecraft.world.item.component.ItemLore \
                     net.minecraft.world.item.ItemLore \
                     net.minecraft.network.chat.Component \
                     net.minecraft.world.item.ItemStack \
                     net.minecraft.world.Container \
                     net.minecraft.world.entity.player.Inventory \
                     net.minecraft.core.Registry \
                     net.minecraft.world.level.levelgen.Heightmap \
                     net.minecraft.server.network.Filterable \
                     com.mojang.authlib.GameProfile ; do
              echo "--- $c ---"
              javap -cp "$JAR" "$c" 2>&1 | grep -E "public|protected|class |interface " | grep -E "$PAT|class |interface " | head -60
            done
            echo "===== SMALL CLASSES (full) ====="
            for c in net.minecraft.world.item.component.CustomData net.minecraft.world.item.component.ItemLore net.minecraft.world.item.ItemLore net.minecraft.world.item.component.WrittenBookContent net.minecraft.server.network.Filterable net.minecraft.server.permissions.PermissionSet net.minecraft.server.permissions.Permission net.minecraft.server.permissions.LevelBasedPermissionSet net.minecraft.world.entity.player.Player ; do
              echo "--- $c ---"
              javap -cp "$JAR" "$c" 2>&1 | head -30
            done
            echo "===== SOUND EVENTS ====="
            javap -cp "$JAR" net.minecraft.sounds.SoundEvents 2>&1 | grep -E "NOTE_BLOCK_BASS|NOTE_BLOCK_PLING|UI_BUTTON_CLICK|ITEM_BREAK|LEVER_CLICK|GENERIC_EXPLODE|EXPERIENCE_ORB_PICKUP|PLAYER_LEVELUP|AMETHYST_BLOCK_BREAK|STONE_BREAK|PISTON_CONTRACT|BLOCK_PLACE|BLOCK_HIT" | head -50
          done
          } | tee api-dump.txt

      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump-${{ matrix.module }}
          path: api-dump.txt
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: strike-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/strike-fabric-*.jar
          generate_release_notes: true
