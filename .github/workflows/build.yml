name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ fabric-1.20.1, fabric-1.21.1, fabric-1.21.11, fabric-26.3 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ matrix.module }}:build --stacktrace

      - name: Dump Minecraft API
        if: always()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches/fabric-loom -name "*.jar" | grep -v sources); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/entity/Entity.class"; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          {
            echo "===== CLASS NAMES OF INTEREST ====="
            unzip -l "$JAR" 2>/dev/null | grep -E "NbtComponent|ListComponent|ComponentList|WrittenBook|LoreComponent|CustomData|InteractionResult|Filterable" | awk '{print $4}'
            echo "===== API ====="
            for c in net.minecraft.world.entity.Entity \
                     net.minecraft.server.level.ServerPlayer \
                     net.minecraft.server.MinecraftServer \
                     net.minecraft.commands.CommandSourceStack \
                     net.minecraft.world.level.Level \
                     net.minecraft.world.level.block.entity.BlockEntity \
                     net.minecraft.core.component.DataComponents \
                     net.minecraft.nbt.CompoundTag \
                     net.minecraft.nbt.NbtComponent \
                     net.minecraft.core.component.NbtComponent \
                     net.minecraft.network.chat.ComponentList \
                     net.minecraft.network.chat.ListComponent \
                     net.minecraft.network.chat.Component \
                     net.minecraft.world.item.ItemStack \
                     net.minecraft.world.item.Inventory \
                     net.minecraft.world.Container \
                     net.minecraft.core.Registry \
                     net.minecraft.world.level.levelgen.Heightmap \
                     net.minecraft.world.entity.player.Inventory ; do
              echo "--- $c ---"
              javap -cp "$JAR" "$c" 2>&1 | grep -E "public|protected|class |interface " | head -70
            done
            echo "===== SOUND EVENTS ====="
            javap -cp "$JAR" net.minecraft.sounds.SoundEvents 2>&1 | grep -E "BREAK|CLICK|NOTE_BLOCK|CHIME|EXPLODE|PICKUP|LEVELUP|PORTAL|POP" | head -60
            echo "===== WRITTEN BOOK CONTENT ====="
            javap -cp "$JAR" net.minecraft.world.item.component.WrittenBookContent 2>&1 | head -30
            echo "===== COMPONENT LIST / LORE ====="
            javap -cp "$JAR" net.minecraft.network.chat.ComponentList 2>&1 | head -25
          } | tee api-dump.txt

      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump-${{ matrix.module }}
          path: api-dump.txt
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: strike-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/strike-fabric-*.jar
          generate_release_notes: true
